name: Publish language packs

# Puts the language packs of a GitHub release (e.g. languages-1.0.0) on Modrinth, one draft project per
# language. Each jar must match the size and SHA-512 the mod's catalog pins. Run it with "apply" off to
# see what would happen. Drafts stay private until they're submitted for review on Modrinth.
on:
  workflow_dispatch:
    inputs:
      release:
        description: GitHub release holding the pack jars, e.g. languages-1.0.0
        required: true
        type: string
      apply:
        description: Create the projects and upload the packs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
      - name: Download the packs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: gh release download "$RELEASE" --dir packs --pattern '*.jar'
      - name: Publish on Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          APPLY: ${{ inputs.apply }}
        run: python3 tools/modrinth_language_packs.py packs $([ "$APPLY" = true ] && echo --apply)
