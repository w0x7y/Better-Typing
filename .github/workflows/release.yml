name: Release

# `git tag v0.1.0 && git push origin v0.1.0` builds every version and uploads the jars to Modrinth.
# Run it by hand with "dry run" on to see what would be uploaded without uploading it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the uploads instead of making them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # A tag that disagrees with gradle.properties would upload jars whose own version says otherwise.
      - name: Check the tag against mod_version
        if: github.ref_type == 'tag'
        run: |
          declared="$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [ "${GITHUB_REF_NAME#v}" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mod_version=$declared"
            exit 1
          fi

      - name: Build and test every version
        run: ./gradlew build --stacktrace

      - name: Upload to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          DRY_RUN: ${{ github.ref_type != 'tag' && inputs.dry_run }}
        run: ./gradlew modrinth -Pmodrinth_dry_run="$DRY_RUN" --stacktrace

      # Minotaur can't set where the mod runs, so every version is marked client-only afterwards.
      - name: Mark the versions as client-only
        if: github.ref_type == 'tag' || !inputs.dry_run
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 tools/modrinth_versions.py --environment
