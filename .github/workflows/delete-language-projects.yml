name: Delete the language pack drafts

# One-off: deletes the seven draft language pack projects on Modrinth. The packs live only on the GitHub
# release now. Only these slugs, and only drafts titled "Better Typing: ...", are ever deleted.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
      - name: Delete the drafts
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        shell: python
        run: |
          import json, os, sys, urllib.error, urllib.request
          SLUGS = ["better-typing-german", "better-typing-spanish", "better-typing-french", "better-typing-italian",
                   "better-typing-dutch", "better-typing-portuguese-brazil", "better-typing-swedish"]
          HEADERS = {"Authorization": os.environ["MODRINTH_TOKEN"], "User-Agent": "w0x7y/Better-Typing (https://github.com/w0x7y/Better-Typing)"}

          def call(method, path):
              request = urllib.request.Request("https://api.modrinth.com/v2" + path, headers=HEADERS, method=method)
              with urllib.request.urlopen(request, timeout=60) as response:
                  text = response.read().decode()
                  return json.loads(text) if text else None

          failed = False
          for slug in SLUGS:
              try:
                  project = call("GET", f"/project/{slug}")
              except urllib.error.HTTPError as error:
                  print(f"{slug}: not found (HTTP {error.code}), nothing to delete")
                  continue
              if project["slug"] != slug or project["status"] != "draft" or not project["title"].startswith("Better Typing: "):
                  print(f"{slug}: left alone, it's {project['status']} and titled {project['title']!r}")
                  failed = True
                  continue
              try:
                  call("DELETE", f"/project/{project['id']}")
                  print(f"{slug}: deleted")
              except urllib.error.HTTPError as error:
                  print(f"{slug}: Modrinth refused: HTTP {error.code} {error.read().decode('utf-8', 'replace')}")
                  failed = True
          sys.exit(1 if failed else 0)
