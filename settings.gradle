pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'better-typing'

include 'core'

// One project per supported Minecraft version; each builds its own mod jar.
file('versions').eachDir { dir ->
	include dir.name
	project(":${dir.name}").projectDir = dir
}
