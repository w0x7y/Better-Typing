// Applied by every versions/<mc>/build.gradle. Reads per-version values from that folder's gradle.properties.
apply plugin: project.loom_plugin
apply plugin: 'com.modrinth.minotaur'

def remap = project.loom_plugin == 'net.fabricmc.fabric-loom-remap'
def javaVersion = project.java_version as int

version = "${project.mod_version}+${project.name}"

base {
	archivesName = 'better-typing'
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	// YetAnotherConfigLib's newest builds are only on Modrinth.
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'Quilt'
		url = 'https://maven.quiltmc.org/repository/release/'
		content {
			includeGroup 'org.quiltmc.parsers'
		}
	}
}

sourceSets {
	main {
		// core + common are shared by all versions; each variant holds code for a group of versions
		// that share an API (rendering, key codes).
		java.srcDirs += [rootProject.file('core/src/main/java'), rootProject.file('common/src/main/java')]
		resources.srcDirs += [rootProject.file('common/src/main/resources')]
		project.variants.split(',').each { name ->
			java.srcDirs += rootProject.file("variants/${name.trim()}/src/main/java")
			resources.srcDirs += rootProject.file("variants/${name.trim()}/src/main/resources")
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (remap) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		modImplementation "maven.modrinth:yacl:${project.yacl_version}"
		modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
		modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
		// YACL bundles its JSON library, but a remapped dev client doesn't load bundled jars.
		localRuntime "org.quiltmc.parsers:json:0.2.1"
		localRuntime "org.quiltmc.parsers:gson:0.2.1"
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		implementation "maven.modrinth:yacl:${project.yacl_version}"
		compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
		localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	}
}

// In-game tests: ./gradlew :<mc>:runClientGameTest (opens a game window, screenshots go to build/run/clientGameTest).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'bettertyping-test'
		enableGameTests = false
		eula = true
	}
}

sourceSets {
	gametest {
		java.srcDirs += rootProject.file('common/src/gametest/java')
		resources.srcDirs += rootProject.file('common/src/gametest/resources')
	}
}

loom {
	runs {
		configureEach {
			// Share one run folder per version so worlds and options survive rebuilds.
			runDir = "../../run/${project.name}"
		}
	}
}

processResources {
	def props = [
		version: project.version,
		minecraft_dependency: project.minecraft_dependency,
		java_version: javaVersion,
		// The YACL build compiled against is the oldest one the jar accepts.
		yacl_min_version: project.yacl_version.split('\\+')[0],
	]
	inputs.properties props

	filesMatching(['fabric.mod.json', '*.mixins.json']) {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	from(rootProject.file('LICENSE'))
}

// Publishing: `./gradlew modrinth` with MODRINTH_TOKEN set uploads every version's jar, run by
// .github/workflows/release.yml. `-Pmodrinth_dry_run=true` builds the whole upload and prints it instead.
modrinth {
	projectId = project.modrinth_id
	versionNumber = project.version
	versionName = "Better Typing ${project.mod_version} for Minecraft ${project.name}"
	versionType = project.release_type
	gameVersions = project.modrinth_game_versions.split(',').collect { it.trim() }
	loaders = ['fabric']
	// Rewrite Modrinth/changelog.md for every release.
	changelog = rootProject.file('Modrinth/changelog.md').text
	uploadFile = remap ? remapJar : jar
	debugMode = providers.gradleProperty('modrinth_dry_run').map { it.toBoolean() }.orElse(false)
	dependencies {
		required.project 'fabric-api'
		required.project 'yacl'
	}
}
